# Voice Commands Configuration
#
# Three layers of matching (in priority order):
#
#   1. Dictation  — "write/type/dictate <text>" → types verbatim via ydotool
#   2. Search     — "search for/google/find <query>" → opens browser search
#   3. App slots  — "{verb} {app}" resolved from the `apps` + `verbs` registry
#                   below. No need to list every combination manually.
#                   e.g. "close settings", "launch terminal", "quit vs code"
#   4. Intents    — fixed commands (scroll, volume, tabs, zoom, editing, etc.)
#   5. Assistant  — anything unmatched goes to the local LLM (Nova / Ollama)
#
# Chaining: "and", "then", "also" between commands runs them in sequence.
#   e.g. "open terminal and close firefox"

# ── Interpreter flag ───────────────────────────────────────────────────────────
# Set to "v2" once JSONL confirms v2 handles all daily commands.
# Delete legacy path and this key after cutover is complete.
interpreter: legacy

# ── App registry ──────────────────────────────────────────────────────────────
# Add any app here. Supported verb keys: open, close, focus, minimize, maximize.
# focus/minimize/maximize require wmctrl (sudo apt install wmctrl).
# If a verb key is missing the command falls through to the intents table.

apps:
  firefox:
    aliases: [firefox, browser, web, chrome, chromium]
    open:     "firefox -P default"
    close:    "pkill -SIGTERM firefox || pkill -SIGTERM -f 'chrome|chromium'"
    focus:    "wmctrl -a firefox"

  terminal:
    aliases: [terminal, console, shell, command line]
    open:     "gnome-terminal"
    close:    "pkill -SIGTERM gnome-terminal"
    focus:    "wmctrl -a terminal"

  settings:
    aliases: [settings, preferences, control center, system settings, gnome settings]
    open:     "gnome-control-center"
    close:    "pkill -SIGTERM gnome-control-center"
    focus:    "wmctrl -a control-center"

  vscode:
    aliases: [vscode, vs code, code, editor, code editor, visual studio]
    open:     "code"
    close:    "pkill -SIGTERM code"
    focus:    "wmctrl -a code"

  files:
    aliases: [files, file manager, finder, nautilus, folder, file browser]
    open:     "nautilus"
    close:    "pkill -SIGTERM nautilus"
    focus:    "wmctrl -a nautilus"

  calculator:
    aliases: [calculator, calc]
    open:     "gnome-calculator"
    close:    "pkill -SIGTERM gnome-calculator"

  spotify:
    aliases: [spotify, music, spotify app]
    open:     "spotify"
    close:    "pkill -SIGTERM spotify"
    focus:    "wmctrl -a spotify"

  discord:
    aliases: [discord, discord app]
    open:     "discord"
    close:    "pkill -SIGTERM discord"
    focus:    "wmctrl -a discord"

  slack:
    aliases: [slack, slack app]
    open:     "slack"
    close:    "pkill -SIGTERM slack"
    focus:    "wmctrl -a slack"

  vlc:
    aliases: [vlc, media player, video player]
    open:     "vlc"
    close:    "pkill -SIGTERM vlc"
    focus:    "wmctrl -a vlc"

# ── Verb registry ─────────────────────────────────────────────────────────────
# Each verb maps to a list of trigger phrases.
# Longer / more specific phrases win over shorter ones when multiple match.

verbs:
  open:
    - open
    - launch
    - start
    - run
    - load
    - bring up
    - show me
    - open up
    - fire up

  close:
    - close
    - quit
    - exit
    - kill
    - shut down
    - terminate
    - shut
    - close out
    - close down

  focus:
    - focus
    - switch to
    - go to
    - activate
    - show
    - bring back
    - go back to
    - jump to

  minimize:
    - minimize
    - hide

  maximize:
    - maximize
    - expand


# ── Fixed intents ─────────────────────────────────────────────────────────────
# These handle everything that doesn't fit the {verb}+{app} pattern:
# tabs, scrolling, volume, zoom, editing shortcuts, window manager actions.

intents:

  # ── Slot-based intents (Tier 1 pattern matching) ──────────────────────────────
  # These use typed {slots} for deterministic extraction before fuzzy matching.

  open_app:
    phrases:
      - open {app}
      - launch {app}
      - start {app}
      - run {app}
    pattern: "open {app}"
    action: "{app.open}"

  close_app:
    phrases:
      - close {app}
      - quit {app}
      - kill {app}
    pattern: "close {app}"
    action: "{app.close}"

  type_text:
    phrases:
      - type {text}
      - write {text}
      - dictate {text}
    pattern: "type {text}"
    action: "ydotool type --delay 100 -- {text}"

  # ── Discrete volume levels 1–10 (1=10%, 5=50%, 10=100%) ─────────────────────
  volume_1:
    phrases: [volume 1, volume one, set volume 1, set volume to 1]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%"

  volume_2:
    phrases: [volume 2, volume two, set volume 2, set volume to 2]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 20%"

  volume_3:
    phrases: [volume 3, volume three, set volume 3, set volume to 3]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 30%"

  volume_4:
    phrases: [volume 4, volume four, set volume 4, set volume to 4]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 40%"

  volume_5:
    phrases: [volume 5, volume five, set volume 5, set volume to 5]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 50%"

  volume_6:
    phrases: [volume 6, volume six, set volume 6, set volume to 6]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 60%"

  volume_7:
    phrases: [volume 7, volume seven, set volume 7, set volume to 7]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 70%"

  volume_8:
    phrases: [volume 8, volume eight, set volume 8, set volume to 8]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 80%"

  volume_9:
    phrases: [volume 9, volume nine, set volume 9, set volume to 9]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 90%"

  volume_10:
    phrases: [volume 10, volume ten, set volume 10, set volume to 10, max volume, volume max, full volume]
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 100%"

  # {number} = literal percentage; requires the word "percent" to avoid
  # ambiguity with the 0–10 scale above ("set volume to 50 percent").
  set_volume:
    phrases:
      - set volume to {number} percent
      - volume {number} percent
    pattern: "set volume to {number} percent"
    action: "wpctl set-volume @DEFAULT_AUDIO_SINK@ {number}%"

  # {level} brightness on the same 0–10 scale (brightnessctl must be installed).
  set_brightness_level:
    phrases:
      - set brightness to {level}
      - brightness level {level}
      - brightness {level}
      - set brightness {level}
    pattern: "set brightness to {level}"
    action: "brightnessctl set {level}%"

  # Explicit-percent brightness ("set brightness to 75 percent").
  set_brightness:
    phrases:
      - set brightness to {number} percent
      - brightness {number} percent
    pattern: "set brightness to {number} percent"
    action: "brightnessctl set {number}%"

  # ── Tab management ───────────────────────────────────────────────────────────
  close_tab:
    phrases:
      - close tab
      - close this tab
      - close current tab
      - close the tab
      - shut tab
      - exit tab
      - kill tab
      - close browser tab
      - close this browser tab
      - close firefox tab
      - close this firefox tab
      - close current firefox tab
      - close chrome tab
      - close this chrome tab
      - shut this tab
      - get rid of this tab
      - remove this tab
    action: "ydotool key --delay 0 ctrl+w"

  new_tab:
    phrases:
      - new tab
      - open tab
      - open new tab
      - create tab
      - add tab
      - open a new tab
      - create a new tab
      - new browser tab
    action: "ydotool key --delay 0 ctrl+t"

  reopen_tab:
    phrases:
      - reopen tab
      - restore tab
      - undo close tab
      - bring back tab
      - reopen closed tab
      - restore closed tab
      - get back last tab
    action: "ydotool key --delay 0 ctrl+shift+t"

  next_tab:
    phrases:
      - next tab
      - tab right
      - go to next tab
      - switch tab right
      - move to next tab
      - tab forward
      - go right tab
    action: "ydotool key --delay 0 ctrl+Tab"

  previous_tab:
    phrases:
      - previous tab
      - last tab
      - tab left
      - go to previous tab
      - switch tab left
      - prior tab
      - tab back
      - move to previous tab
      - go left tab
    action: "ydotool key --delay 0 ctrl+shift+Tab"

  # ── Window management ────────────────────────────────────────────────────────
  close_window:
    phrases:
      - close window
      - close this window
      - close the window
      - quit window
      - exit window
      - close application
      - close this application
      - close app
      - close this app
      - quit application
      - quit app
      - close program
      - quit program
      - exit application
    action: "ydotool key --delay 0 alt+F4"

  new_window:
    phrases:
      - new window
      - open new window
      - create window
      - open a new window
      - new browser window
    action: "ydotool key --delay 0 ctrl+n"

  minimize_window:
    phrases:
      - minimize
      - minimize window
      - hide window
      - shrink window
      - send to taskbar
      - minimize this
      - hide this window
    action: "ydotool key --delay 0 super+h"

  maximize_window:
    phrases:
      - maximize
      - maximize window
      - full window
      - expand window
      - make window bigger
      - make it bigger
      - maximize this
    action: "ydotool key --delay 0 super+Up"

  fullscreen:
    phrases:
      - fullscreen
      - full screen
      - toggle fullscreen
      - go fullscreen
      - enter fullscreen
      - exit fullscreen
      - fullscreen mode
    action: "ydotool key --delay 0 F11"

  # ── App switcher ─────────────────────────────────────────────────────────────
  switch_app:
    phrases:
      - switch app
      - switch application
      - next application
      - alt tab
      - switch window
      - next window
      - change app
      - task switch
