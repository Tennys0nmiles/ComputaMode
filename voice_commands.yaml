# ── Stage 3: conversational assistant ────────────────────────────────────────
assistant:
  enabled: true

  llm:
    model: llama3.2:3b
    base_url: http://localhost:11434
    max_history_turns: 4
    temperature: 0.7

  tts:
    engine: kokoro                            # or: piper (legacy fallback)
    model_path: models/kokoro/kokoro-v1.0.onnx
    voices_path: models/kokoro/voices-v1.0.bin
    speed: 1.0
    # ── Voice blend ──────────────────────────────────────────────────
    blend:
      - voice: af_nicole
        weight: 0.2
      - voice: af_bella
        weight: 0.8
    # To revert to a single voice, comment out blend and uncomment:
    # voice: af_nicole
    # ── Legacy Piper (uncomment the two lines below to revert) ──────
    # engine: piper
    # model_path: models/piper/en_US-lessac-high.onnx

  persona: >
    You are Nova, a helpful and concise female assistant.
    Answer in 1-2 sentences unless the user explicitly asks you to elaborate.
    Never describe, narrate, or repeat back computer actions — those are
    handled separately and silently.


# ── Matching settings ─────────────────────────────────────────────────────────
matching:
  confidence_threshold: 0.55
  strip_fillers: true
  filler_words: [um, uh, like, so, please, hey, okay, ok, can you, could you]
  v2_confidence_threshold: 0.75
  v2_margin_gap: 0.10
  tier3_timeout_seconds: 6
