# Voice Commands Configuration
# Each intent has a list of phrases (synonyms/variations) and an action.
#
# Actions:
#   Built-in keywords : scroll_up, scroll_down, left_click, right_click,
#                       pause_gestures, resume_gestures
#   Anything else     : executed as a shell command
#
# Chaining: say "and", "then", or "also" between commands to run multiple.
#   e.g. "close tab and open terminal" runs both actions in sequence.
#
# Keyboard shortcuts use xdotool (install: sudo apt install xdotool).
# Fuzzy matching handles minor transcription errors automatically.

